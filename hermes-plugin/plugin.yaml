name: clawsight
version: 2.0.0
description: 'Docker + MCP control for the WSInsight engine family: wsinsight (whole-slide pathology),
  sptxinsight (spatial transcriptomics), hplot (boundary profiling), kurtorank (subtype annotation) and
  wsitrain (model training). Each engine runs in its own container; five tools per engine (start/stop/status/list_tools/call)
  start it and proxy any tool the container exposes. Tool catalogs are discovered live, never hard-coded.'
author: clawsight contributors
provides_tools:
- hplot_call
- hplot_list_tools
- hplot_start
- hplot_status
- hplot_stop
- kurtorank_call
- kurtorank_list_tools
- kurtorank_start
- kurtorank_status
- kurtorank_stop
- sptxinsight_call
- sptxinsight_list_tools
- sptxinsight_start
- sptxinsight_status
- sptxinsight_stop
- wsinsight_call
- wsinsight_list_tools
- wsinsight_start
- wsinsight_status
- wsinsight_stop
- wsitrain_call
- wsitrain_list_tools
- wsitrain_start
- wsitrain_status
- wsitrain_stop
