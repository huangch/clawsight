# Pre-commit hooks for the clawsight repository.
#
# Two local hooks gate the two drift surfaces called out in the review:
#
#   1. `clawsight-tools-yaml-sync` keeps `hermes-plugin/plugin.yaml`'s
#      `provides_tools:` list in sync with the actual `ctx.register_tool(...)`
#      calls in `__init__.py` — the registry is the single source of truth.
#
#   2. `clawsight-skill-md-sync` enforces the clawpyter-style rule: the Hermes
#      SKILL.md must mirror the OpenClaw SKILL.md. Adopt the OpenClaw copy
#      as the canonical source when they differ (OpenClaw is the newer
#      editor's working tree in practice).
#
# The pre-commit Python here uses the project-local `hermes-plugin/`
# interpreter path (pyyaml is already in the hermes-agent runtime env).
# Override `CLAWSIGHT_PYTHON=/path/to/python` to install on a different
# interpreter if needed.

repos:
  - repo: local
    hooks:
      - id: clawsight-tools-yaml-sync
        name: clawsight tools/yaml sync (provides_tools vs register())
        entry: bash -c 'CLAWSIGHT_PYTHON="${CLAWSIGHT_PYTHON:-/opt/anaconda3/envs/wsi/bin/python}" && exec "$CLAWSIGHT_PYTHON" "hermes-plugin/tools_sync.py" --check'
        language: system
        pass_filenames: false
        files: ^hermes-plugin/(plugin\.yaml|__init__\.py)$

      - id: clawsight-skill-md-sync
        name: clawsight SKILL.md (Hermes mirrors OpenClaw)
        entry: bash -c 'diff -u "openclaw-plugin/skills/clawsight/SKILL.md" "hermes-plugin/SKILL.md" >/dev/null && exit 0; echo "hermes-plugin/SKILL.md is out of sync with openclaw-plugin/skills/clawsight/SKILL.md."; echo "Adopt the OpenClaw copy (cp openclaw-plugin/skills/clawsight/SKILL.md hermes-plugin/SKILL.md) unless the divergence is intentional."; exit 1'
        language: system
        pass_filenames: false
        files: ^(hermes-plugin|openclaw-plugin/skills/clawsight)/SKILL\.md$
